[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finaudit-rl"
version = "1.0.0"
description = "Reproducible RL environment for financial-audit agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "FinAudit RL Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
finaudit = "finaudit.cli:main"

[tool.setuptools.packages.find]
include = ["finaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
